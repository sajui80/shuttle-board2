<style>
:root{
  --brand:#B25E08; --brand-dark:#8F4A06; --brand-light:#D97D1E; --header:#2F3944;
  --tint:#FBF0E2; --tint-2:#F0D6AE; --glass:#CDEFDD;
  --surface:#FFFFFF; --bg:#F1F2F4;
  --text:#14171A; --text-2:#3B434B; --muted:#606A74; --line:#DEE2E6;
  --warn:#A85A08; --warn-tint:#FCF2E2; --danger:#B3261E; --danger-tint:#FAE8E6;
  --danger-line:#F2CFCB; --ok:#146C43;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:ui-monospace,"Roboto Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r-trip:#1D4ED8; --rb-trip:#E3EBFD;
  --r-vac:#0F766E;  --rb-vac:#DDF0EE;
  --r-own:#6D28D9;  --rb-own:#EEE6FD;
  --r-etc:#475569;  --rb-etc:#E7EDF3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
/* 당겨서 새로고침 차단: 문서 자체는 스크롤하지 않고, 안쪽 .scroll 만 스크롤한다 */
html,body{
  margin:0; padding:0; height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-overflow-scrolling:touch;
}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  position:fixed; inset:0; width:100%;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}

/* ---------- 로딩 / 스플래시 ---------- */
.splash{
  position:fixed;inset:0;background:var(--header);z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  transition:opacity .35s ease;
}
.splash.hide{opacity:0;pointer-events:none;}
.splash svg{width:230px;max-width:62vw;margin-bottom:24px;
  --body:#FFFFFF;--body2:#E2E4E6;--glass:#9AA5AE;--glass2:#C2CAD1;--trim:#D8DBDE;
  --accent:#2F3944;--edge:rgba(255,255,255,0);--pillar:#1E252C;--tire:#161C22;
  --rim:#EEF0F1;--lamp:#F2C14E;--tail:#E5202E;}
.splash .logo{font-size:29px;font-weight:900;letter-spacing:-.035em;}
.splash .tag{font-size:12px;opacity:.85;margin-top:5px;letter-spacing:.06em;}
.splash .err{
  margin-top:22px;background:rgba(0,0,0,.22);border-radius:12px;padding:12px 16px;
  font-size:12.5px;max-width:80vw;text-align:center;line-height:1.6;display:none;
}

/* ---------- 차량 SVG ---------- */
.car{width:100%;height:auto;display:block;
  --body:#FFFFFF; --body2:#E4EBE7; --glass:#BEE6D2; --glass2:#DCF3E7;
  --trim:#BCC9C2; --accent:#00B14F; --edge:#D3DDD7; --pillar:#26332C;
  --tire:#2A3138; --rim:#D8DEE2; --lamp:#93AEBE; --tail:#E5202E;}

/* ---------- 온보딩 ---------- */
.ob{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);overflow-y:auto;overscroll-behavior:contain;}
.ob-top{background:var(--header);padding:28px 0 34px;display:flex;justify-content:center;}
.ob-top svg{width:212px;}
.ob-icon{width:88px;height:88px;border-radius:28px;background:rgba(255,255,255,.19);display:flex;align-items:center;justify-content:center;}
.ob-icon svg{width:42px;height:42px;fill:#fff;}
.ob-sheet{background:var(--surface);border-radius:28px 28px 0 0;margin-top:-26px;flex:1;min-height:340px;padding:28px 22px 26px;display:flex;flex-direction:column;}
.ob-h{font-size:26px;font-weight:900;letter-spacing:-.025em;line-height:1.3;}
.ob-p{font-size:14.5px;color:var(--text-2);line-height:1.7;margin-top:10px;}
.field{margin-top:22px;}
.field label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.07em;}
.field input{
  width:100%;margin-top:7px;border:1.5px solid var(--line);border-radius:14px;
  padding:13px 15px;font-weight:700;outline:none;background:var(--surface);color:var(--text);
}
.field input:focus{border-color:var(--brand);}
.hint{font-size:13px;color:var(--muted);margin-top:9px;padding-left:3px;line-height:1.55;min-height:19px;}
.hint.warn{color:var(--warn);font-weight:700;}
.hint.bad{color:var(--danger);font-weight:700;}

/* ---------- 헤더 ---------- */
.ghead{background:var(--header);padding:0 0 30px;flex-shrink:0;}
.ghead-in{padding:14px 20px 0;color:#fff;position:relative;}
.ghead .date{font-size:15.5px;opacity:.95;font-weight:700;letter-spacing:-.01em;}
.gh-sym{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:108px;pointer-events:none;}
.gh-sym.front{width:106px;}
.gh-sym.cal{width:72px;}
.has-sym.front-sym .date,.has-sym.front-sym .hello{padding-right:114px;}
.has-sym.cal-sym .date,.has-sym.cal-sym .hello{padding-right:82px;}
.gh-sym svg{width:100%;height:auto;display:block;}
.has-sym .date,.has-sym .hello{padding-right:112px;}
.has-sym.small-sym .date,.has-sym.small-sym .hello{padding-right:96px;}
.ghead .hello{font-size:19px;font-weight:700;letter-spacing:-.015em;margin-top:5px;
  display:flex;align-items:baseline;flex-wrap:wrap;}
.ghead .hello b{font-size:27px;font-weight:900;letter-spacing:-.03em;margin-right:1px;}
.ghead.admin{background:var(--text);}
.countdown{
  display:inline-flex;align-items:center;gap:6px;margin-top:13px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);
  color:#fff;border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:700;
}
.backbtn{font-size:16px;font-weight:700;opacity:.98;padding:6px 0;display:inline-block;}
/* 미이용 화면 가독성 */
.lvsheet .seclbl{font-size:13.5px;font-weight:800;color:var(--text-2);letter-spacing:.02em;margin:22px 4px 10px;}
.lvsheet .rsn{padding:13px 4px 11px;}
.lvsheet .rsn .ri{width:36px;height:36px;}
.lvsheet .rsn .ri svg{width:19px;height:19px;}
.lvsheet .rsn .rt{font-size:13.5px;}
.lvsheet .qc{font-size:12.5px;padding:9px 10px;}
.lvsheet .dcell{padding:10px 13px 11px;}
.lvsheet .dcell span{font-size:11.5px;}
.lvsheet .dcell b{font-size:20px;}
.lvsheet .dcell em{font-size:12.5px;}
.lvsheet .dpreview{padding:13px 15px;}
.lvsheet .dp-t{font-size:14.5px;}
.lvsheet .dp-d{font-size:12.5px;}
.lvsheet .dnote{font-size:13.5px;line-height:1.75;}
.lvsheet .lv-d{font-size:12.5px;}
.lvsheet .rsnchip{font-size:12px;}

.sheet{background:var(--bg);border-radius:26px 26px 0 0;margin-top:-24px;padding:20px 16px 26px;min-height:100%;}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.seclbl{font-size:12.5px;font-weight:800;color:var(--text-2);letter-spacing:.06em;margin:22px 4px 10px;}
.seclbl:first-child{margin-top:2px;}
.card{background:var(--surface);border-radius:18px;padding:15px;box-shadow:0 1px 3px rgba(16,24,20,.07);}
.group{border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(16,24,20,.07);}

/* ---------- 내 상태 ---------- */
.mystat{display:flex;gap:12px;align-items:flex-start;border-radius:18px;padding:15px;}
.mystat.lvwrap{display:block;}
.mystat-row{display:flex;gap:12px;align-items:flex-start;}
.mystat.none{background:var(--danger-tint);border:1px solid #F7CDD2;}
.mystat.ok{background:var(--tint);border:1px solid var(--tint-2);}
.mystat.leave{background:#EFF2F5;border:1px solid #DDE3E9;}
.mystat .ic{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;font-weight:800;}
.mystat.none .ic{background:var(--danger);}
.mystat.ok .ic{background:var(--brand);}
.mystat.leave .ic{background:#7A8794;}
.mystat .t{font-size:16.5px;font-weight:800;letter-spacing:-.01em;}
.mystat.none .t{color:#B3141F;} .mystat.ok .t{color:var(--brand-dark);} .mystat.leave .t{color:#455160;}
.mystat .d{font-size:13.5px;color:var(--text-2);margin-top:4px;line-height:1.55;}
.lvbtns{display:flex;gap:7px;margin-top:12px;}
.lvbtns .btn{flex:1;min-width:0;background:var(--surface);border-color:#CFD5DB;color:#37414A;
  padding:12px 6px;font-size:14.5px;white-space:nowrap;}

/* ---------- 차량 카드 ---------- */
.carcard{background:var(--surface);border-radius:18px;padding:13px 14px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(16,24,20,.07);border:1.5px solid transparent;}
.carcard.picked{border-color:var(--brand);background:var(--tint);}
.carcard.closed{opacity:.66;}
.cc-top{display:flex;align-items:center;gap:8px;}
.cc-name b{font-size:21px;font-weight:900;color:var(--brand);margin-right:1px;letter-spacing:-.02em;}
.carcard.closed .cc-name b{color:var(--muted);}
.carcard.picked .cc-name b{color:var(--brand-dark);}
.cc-name{font-size:16.5px;font-weight:800;display:flex;align-items:baseline;}
.picktag{font-size:12px;font-weight:800;background:var(--brand);color:#fff;padding:4px 11px;border-radius:999px;}
.cc-time{margin-left:auto;font-family:var(--mono);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;}
.cc-art{margin:5px 0 7px;border-radius:12px;padding:5px 8px 0;background:linear-gradient(180deg,#F7F7F6 0%,#ECEDEC 100%);}
.cc-art.warn{background:linear-gradient(180deg,#FDF4E6 0%,#F8EAD4 100%);}
.cc-art.full{background:linear-gradient(180deg,#F5F7F6 0%,#EDF0EE 100%);}
.cc-art .car{max-width:132px;margin:0 auto;}
.cc-mid{display:flex;align-items:center;gap:8px;}
.cc-driver{font-size:13.5px;color:var(--text-2);}
.cc-driver b{color:var(--text);font-weight:700;}
.callbtn{width:28px;height:28px;border-radius:999px;background:var(--tint);border:1px solid var(--tint-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.picked .callbtn{background:#fff;}
.callbtn svg{width:14px;height:14px;fill:var(--brand-dark);}
.cc-seat{margin-left:auto;display:flex;align-items:center;gap:7px;}
.seats{display:flex;gap:3px;}
.seats i{display:block;width:11px;height:6px;border-radius:3px;background:var(--line);}
.seats i.on{background:var(--brand);} .seats i.warn{background:var(--warn);} .seats i.full{background:var(--danger);}
.cc-cnt{font-size:13px;font-weight:800;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.cc-cnt.warn{color:var(--warn);} .cc-cnt.full{color:var(--danger);}
.cc-foot{display:flex;align-items:center;gap:8px;margin-top:10px;}
.riders{display:flex;flex-wrap:wrap;gap:5px;flex:1;}
.riders span{font-size:14.5px;background:var(--bg);color:var(--text-2);padding:6px 13px;border-radius:999px;font-weight:700;}
.riders span.me{background:var(--brand);color:#fff;font-weight:800;}
.picked .riders span{background:#fff;}
.picked .riders span.me{background:var(--brand);color:#fff;}

.carcard.slim{padding:11px 13px 10px;}
.slim-top{display:flex;align-items:center;gap:10px;}
.slim-art{width:72px;flex-shrink:0;border-radius:10px;padding:3px 4px 0;background:linear-gradient(180deg,#F7F7F6 0%,#ECEDEC 100%);}
.slim-art.warn{background:linear-gradient(180deg,#FDF4E6 0%,#F8EAD4 100%);}
.slim-art.full{background:linear-gradient(180deg,#F5F7F6 0%,#EDF0EE 100%);}
.slim-main{flex:1;min-width:0;}
.slim-r1{display:flex;align-items:center;gap:7px;}
.slim-r1 .cc-time{font-size:17px;}
.slim-r2{display:flex;align-items:center;gap:7px;margin-top:5px;}
.slim-r2 .callbtn{width:25px;height:25px;}
.slim-r2 .callbtn svg{width:12px;height:12px;}
.carcard.slim .cc-name{font-size:15.5px;}
.carcard.slim .cc-name b{font-size:19px;}
.carcard.slim .cc-driver{white-space:nowrap;font-size:13px;}
.carcard.slim .cc-cnt{margin-left:auto;font-size:13px;font-weight:800;color:var(--brand-dark);}
.carcard.slim .cc-cnt.full{color:var(--danger);}
.carcard.slim .cc-cnt.warn{color:var(--warn);}

/* ---------- 버튼 ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;font-weight:800;font-size:16px;padding:15px 20px;letter-spacing:-.01em;}
.btn-pri{background:var(--brand);color:#fff;}
.btn-pri:active{background:var(--brand-dark);}
.btn-pri:disabled{background:#D6DBD8;color:#fff;}
.btn-out{background:var(--surface);color:var(--brand-dark);border:1.8px solid var(--tint-2);}
.picked .btn-out{background:#fff;}
.btn-dark{background:var(--text);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:11px 22px;font-size:15px;border-radius:999px;}
.btn-txt{color:var(--muted);font-weight:700;font-size:14px;text-align:center;padding:13px;width:100%;}
.btn-block{width:100%;}

/* ---------- 탭바 ---------- */
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:11px 0 max(13px,env(safe-area-inset-bottom));flex-shrink:0;}
.tab{flex:1;text-align:center;font-size:13.5px;font-weight:800;color:var(--muted);padding:2px 0;letter-spacing:-.02em;}
.tab svg{width:26px;height:26px;display:block;margin:0 auto 4px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.tab.on{color:var(--brand);}

/* ---------- 현황 ---------- */
.prog-top{display:flex;align-items:flex-end;justify-content:space-between;}
.prog-n{font-family:var(--mono);font-size:30px;font-weight:700;}
.prog-n small{font-size:16px;color:var(--muted);}
.prog-l{font-size:13px;color:var(--text-2);font-weight:700;}
.bar{height:7px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s;}
.strow{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline;}
.strow:last-child{border-bottom:none;}
.strow .sl{width:66px;flex-shrink:0;font-size:14px;font-weight:800;}
.strow .sl em{display:block;font-style:normal;font-family:var(--mono);font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px;}
.strow .sn{font-size:13.5px;color:var(--text-2);line-height:1.85;flex:1;min-width:0;}
.sn.crew{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;line-height:1.5;}
.sn.crew .chip{margin:0;padding:5px 4px;font-size:12.5px;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip{display:inline-block;font-size:13px;padding:4px 11px;border-radius:999px;background:var(--bg);color:var(--text-2);margin:0 4px 4px 0;font-weight:600;}
.chip.miss{background:var(--danger-tint);color:#93211A;font-weight:800;}
.notice.warn .chip.miss{background:#FFFFFF;color:#93211A;}
.chip.me{background:var(--brand);color:#fff;font-weight:700;}
.rsnchip{display:inline-flex;align-items:center;gap:5px;font-weight:700;padding:4px 11px 4px 8px;margin:0 4px 4px 0;border-radius:999px;font-size:12.5px;}
.rsnchip svg{width:14px;height:14px;flex-shrink:0;}
.icn{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.r-trip{color:var(--r-trip);background:var(--rb-trip);}
.r-vac{color:var(--r-vac);background:var(--rb-vac);}
.r-own{color:var(--r-own);background:var(--rb-own);}
.r-etc{color:var(--r-etc);background:var(--rb-etc);}
.lv-line{display:block;font-size:13.5px;color:var(--text-2);line-height:1.95;}
.lv-line em{font-style:normal;color:var(--muted);font-size:10.5px;margin-left:4px;font-family:var(--mono);}

/* ---------- 미이용 ---------- */
.rsngrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.rsn{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:11px 4px 9px;text-align:center;}
.rsn.on{border-color:currentColor;}
.rsn .ri{width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;}
.rsn .ri svg{width:17px;height:17px;}
.rsn .rt{font-size:13.5px;font-weight:800;color:var(--text);}
.rsn.on .rt{color:currentColor;}
.rsn.r-trip{background:var(--surface);} .rsn.r-trip.on{background:var(--rb-trip);}
.rsn.r-vac{background:var(--surface);} .rsn.r-vac.on{background:var(--rb-vac);}
.rsn.r-own{background:var(--surface);} .rsn.r-own.on{background:var(--rb-own);}
.rsn.r-etc{background:var(--surface);} .rsn.r-etc.on{background:var(--rb-etc);}
.rsn .ri{background:currentColor;}
.rsn .ri svg{color:#fff;}
.quick{display:flex;gap:5px;margin-bottom:10px;}
.qc{font-size:13px;font-weight:700;padding:9px 10px;border-radius:999px;background:var(--surface);color:var(--text-2);border:1.5px solid var(--line);white-space:nowrap;flex:1;}
.qc.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.daterow{display:flex;align-items:center;gap:8px;}
.dcell{flex:1;min-width:0;background:var(--surface);border:1.5px solid var(--brand);border-radius:14px;padding:8px 12px 9px;position:relative;}
.dcell span{display:block;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.06em;}
.dcell b{font-size:17px;font-weight:600;font-family:var(--mono);}
.dcell em{font-style:normal;font-size:11px;color:var(--muted);margin-left:5px;}
.dcell input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none;}
.darrow{color:var(--muted);font-size:13px;flex-shrink:0;}
.dpreview{display:flex;gap:10px;align-items:center;margin-top:10px;background:var(--tint);border:1px solid var(--tint-2);border-radius:14px;padding:11px 13px;}
.dp-i{width:30px;height:30px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dp-i svg{width:16px;height:16px;}
.dp-t{font-size:13px;font-weight:800;}
.dp-d{font-size:11px;color:var(--text-2);margin-top:1px;}
.dnote{font-size:13px;color:var(--text-2);line-height:1.7;margin-top:11px;padding:0 3px;}
.dnote b{color:var(--text);font-weight:800;}
.lv{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);}
.lv:last-child{border-bottom:none;}
.lv-d{font-size:11.5px;color:var(--text-2);font-family:var(--mono);}
.lv .del{margin-left:auto;color:var(--muted);font-size:16px;padding:0 4px;}

/* ---------- 목록 행 ---------- */
.merow{display:flex;align-items:center;gap:11px;padding:13px 14px;background:var(--surface);border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600;width:100%;text-align:left;color:var(--text);text-decoration:none;}
a.merow,a.merow:visited{color:var(--text);text-decoration:none;}
.merow:last-child{border-bottom:none;}
.merow .mi{width:26px;text-align:center;font-size:15px;flex-shrink:0;}
.merow .mv{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500;}
.toggle{width:38px;height:22px;border-radius:99px;background:var(--brand);position:relative;margin-left:auto;flex-shrink:0;transition:background .2s;}
.toggle::after{content:"";position:absolute;top:2.5px;left:18.5px;width:17px;height:17px;border-radius:99px;background:#fff;transition:left .2s;}
.toggle.off{background:#D6DBD8;}
.toggle.off::after{left:2.5px;}
.adminbadge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.2);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;}
.verline{font-size:10.5px;color:var(--muted);text-align:center;margin-top:22px;font-family:var(--mono);}

/* ---------- 달력 ---------- */
.cal-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:10px;}
.cal-h button{color:var(--muted);font-size:18px;padding:0 10px;}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;}
.cal-g b{font-size:9.5px;color:var(--muted);font-weight:700;padding-bottom:3px;}
.cal-g button{font-size:11.5px;padding:8px 0;border-radius:8px;font-family:var(--mono);color:var(--text-2);}
.cal-g button.off{color:transparent;pointer-events:none;}
.cal-g button.hol{background:var(--danger);color:#fff;font-weight:600;}
.cal-g button.sun{color:var(--danger);}
.cal-g button.today{border:1.5px solid var(--brand);color:var(--brand-dark);font-weight:700;}
.holchip{display:inline-flex;align-items:center;gap:6px;background:var(--danger-tint);color:#B3141F;font-size:11px;font-weight:700;padding:4px 8px 4px 11px;border-radius:999px;margin:0 5px 5px 0;}
.holchip em{font-style:normal;opacity:.6;font-size:13px;}

/* ---------- 모달 / 토스트 ---------- */
.modal{position:fixed;inset:0;background:rgba(16,24,20,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center;}
.drrow{display:flex;gap:6px;margin-top:6px;}
.drrow .drPhone{flex:1.7;min-width:0;}
.drrow .drPlate{flex:1;min-width:0;}
.modal-in .field{margin-top:15px;}
.modal-in .field input{padding:11px 13px;font-size:15px;}
.modal-in{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;
  padding:24px 20px max(24px,env(safe-area-inset-bottom));animation:up .22s ease;
  max-height:90vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
@keyframes up{from{transform:translateY(20px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.modal-in{animation:none}}
.modal-h{font-size:17px;font-weight:900;letter-spacing:-.02em;}
.modal-p{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6;}
.modal-row{display:flex;gap:8px;margin-top:20px;}
.modal-row .btn{flex:1;}
.pinbox{display:flex;gap:8px;justify-content:center;margin:20px 0 4px;}
.pinbox input{width:52px;height:58px;text-align:center;font-size:24px;font-weight:800;border:1.5px solid var(--line);border-radius:14px;outline:none;font-family:var(--mono);}
.pinbox input:focus{border-color:var(--brand);}
.toast{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%);line-height:1.5;
  background:rgba(20,30,25,.94);color:#fff;font-size:13px;font-weight:700;
  padding:11px 18px;border-radius:999px;z-index:90;max-width:88vw;text-align:center;
  animation:up .2s ease;
}
.banner{
  display:flex;gap:9px;align-items:center;background:#FFF6E6;border:1px solid #F2D9A6;
  color:#8A5A00;font-size:12px;font-weight:700;padding:10px 13px;border-radius:12px;margin-bottom:14px;line-height:1.5;
}
.banner.red{background:var(--danger-tint);border-color:#F7CDD2;color:#B3141F;}
.empty{color:var(--muted);font-size:13px;padding:7px 2px;}
/* 앱 내 공지 (16:30 미입력 / 17:00 마감) */
.notice{border-radius:18px;padding:16px 16px 14px;margin-top:14px;}
.notice.warn{background:var(--danger-tint);border:1.5px solid var(--danger-line);}
.notice.done{background:var(--tint);border:1.5px solid var(--tint-2);}
.notice .nt{display:flex;align-items:center;gap:9px;font-size:16.5px;font-weight:800;letter-spacing:-.01em;}
.notice.warn .nt{color:#93211A;}
.notice.done .nt{color:var(--brand-dark);}
.notice .nb{font-family:var(--mono);font-size:13px;font-weight:700;color:#fff;
  padding:3px 9px;border-radius:7px;flex-shrink:0;}
.notice.warn .nb{background:var(--danger);}
.notice.done .nb{background:var(--brand);}
.nchips{margin-top:11px;}
.ndesc{font-size:13px;color:var(--text-2);margin-top:10px;line-height:1.6;}
.nsum{margin-top:11px;background:var(--surface);border-radius:12px;padding:4px 13px;}
.nrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);}
.nrow:last-child{border-bottom:none;}
.nrow b{font-size:14px;font-weight:800;width:52px;flex-shrink:0;}
.nrow em{font-style:normal;font-family:var(--mono);font-size:13px;color:var(--muted);}
.nrow span{margin-left:auto;font-size:14px;font-weight:800;color:var(--brand-dark);}
/* 마감 현황 명단 */
.nitem{padding:9px 0;border-bottom:1px solid var(--line);}
.nitem:last-child{border-bottom:none;}
.nrow{display:flex;align-items:baseline;gap:8px;padding:0;border-bottom:none;}
.nrow b{font-size:14.5px;font-weight:800;flex-shrink:0;width:auto;}
.nrow em{font-style:normal;font-family:var(--mono);font-size:13px;color:var(--muted);}
.nrow u{text-decoration:none;font-size:12.5px;color:var(--muted);}
.nrow span{margin-left:auto;font-size:14px;font-weight:800;color:var(--brand-dark);}
.nnames{font-size:13.5px;color:var(--text-2);line-height:1.6;margin-top:4px;}
.nnames.none{color:var(--muted);}
.ncopy{margin-top:13px;}
.ncopy2{margin-top:8px;background:var(--surface);}
/* 차량 번호판 */
.plate{display:inline-flex;align-items:center;gap:5px;flex-shrink:0;
  background:#1B2027;color:#F3F6F8;border-radius:6px;padding:3px 8px 3px 6px;
  font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.06em;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22);}
.plate i{width:4px;height:12px;border-radius:1.5px;background:#F5A524;flex-shrink:0;}
/* 차량 이미지 하단 번호판 */
.platebar{display:flex;justify-content:center;margin:0 0 9px;}
.slim-left{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;}
.slim-left .platebar{margin:0;}
.carcard.slim .plate{font-size:11.5px;padding:2px 7px 2px 5px;letter-spacing:.04em;}
.carcard.slim .plate i{height:9px;}
.guide{font-size:13px;color:var(--text-2);line-height:1.75;}
.guide b{color:var(--text);font-weight:800;}
/* 마감 현황 복사 */
.copybtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 8px;}
.copybtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.copyhint{font-size:11.5px;color:var(--muted);line-height:1.6;margin:0 2px 18px;}
.sharebox{width:100%;height:210px;margin-top:14px;padding:12px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:12.5px;line-height:1.7;resize:none;
  -webkit-user-select:text;user-select:text;}
/* 차량 메모 */
.memos{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:9px 0 1px;}
.memo{display:inline-flex;align-items:center;gap:5px;max-width:100%;
  background:#FFF7E6;color:#9A5B00;border:1px solid #FFE2AE;
  border-radius:999px;padding:5px 7px 5px 11px;font-size:12px;line-height:1.25;}
.memo b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.memo i{font-style:normal;font-weight:600;font-size:11px;opacity:.62;flex-shrink:0;}
.memo button{border:0;background:none;color:inherit;opacity:.5;font-size:16px;
  line-height:1;padding:0 2px;cursor:pointer;flex-shrink:0;}
.memoadd{border:1.4px dashed var(--line);background:none;color:var(--muted);
  border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;}
.memoadd:active{background:var(--tint);}
.carcard.slim .memos{margin-top:7px;}
</style>
</head>

/* ============================================================
   화면 이동
   안드로이드 뒤로가기(취소 버튼) = 한 단계 뒤로 → 최종 홈 화면
   홈 화면에서 한 번 더 누르면 앱 종료
   ------------------------------------------------------------
   history.back() 을 코드에서 부르지 않는다. 항목을 '쌓기만' 하므로
   상태가 어긋나 앱이 갑자기 닫히는 일이 없다.
   ============================================================ */
function atRoot(){ return !modal && !view && tab === 'home'; }
function armHistory(){
  if(!atRoot() && !histArmed){
    histArmed = true;
    try { history.pushState({ sh:1 }, ''); } catch(e){}
  }
}
function openModal(m){ modal = m; render(); }
function closeModal(){ modal = null; render(); }
function openView(v){ view = v; render(); }
function closeView(){ view = null; render(); }
function setTab(k){ tab = k; view = null; render(); }
window.addEventListener('popstate', function(){
  histArmed = false;
  if(modal){ modal = null; render(); return; }   // 1) 팝업 닫기
  if(view){ view = null; render(); return; }     // 2) 하위 화면 → 탭 화면
  if(tab !== 'home'){ tab = 'home'; render(); return; }  // 3) 탭 → 홈
  // 4) 홈에서 뒤로 → 막지 않는다 (앱 종료)
});

/* ============================================================
   유틸
   ============================================================ */
function dateStr(d){
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function pad(n){ return (n<10?'0':'') + n; }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function parseDate(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function isoWeek(d){
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));      // 그 주의 목요일
  var first = new Date(t.getFullYear(), 0, 4);
  first.setDate(first.getDate() + 3 - ((first.getDay() + 6) % 7));
  return 1 + Math.round((t - first) / (7 * 86400000));
}
/* 표준 날짜 표기 — [W37] 2026년 9월 8일 (화) */
function fmtKo(s){
  var d = parseDate(s);
  return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 ('
       + '일월화수목금토'[d.getDay()] + ')';
}
function fmtShort(s){ return s.slice(5).replace('-','.'); }
function addDays(s, n){ var d = parseDate(s); d.setDate(d.getDate()+n); return dateStr(d); }
function minsNow(){ var n = new Date(); return n.getHours()*60 + n.getMinutes(); }
function toMins(hm){ var p = hm.split(':'); return (+p[0])*60 + (+p[1]); }
/* 운행일: 월~토. 일요일만 미운행 */
function isOffDay(s){ return parseDate(s).getDay() === 0; }
function isHoliday(s){
  if(!config) return false;
  if((config.holidays||[]).indexOf(s) >= 0) return true;
  if(config.tempHolidayDate === s) return true;
  return false;
}
function toast(msg){
  var old = document.querySelector('.toast');
  if(old) old.remove();
  var el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.remove(); }, 2200);
}
function cars(){ return (config && config.cars) ? config.cars : DEFAULT_CARS; }
function drivers(){ return (config && config.drivers) ? config.drivers : DEFAULT_DRIVERS; }
function plateOf(d){ return (d && d.plate) || PLATE[d && d.name] || ''; }
function weeksSinceAnchor(){
  var d = new Date(); var day = d.getDay();
  d.setDate(d.getDate() + (day===0 ? -6 : 1-day)); d.setHours(0,0,0,0);
  var weeks = Math.floor((d - ANCHOR_MONDAY) / (7*24*3600*1000));
  return ((weeks % 4) + 4) % 4;
}
function driverFor(slotIdx){
  var list = drivers();
  var i = ((slotIdx - weeksSinceAnchor()) % list.length + list.length) % list.length;
  return list[i] || {name:'-', phone:''};
}
function entries(){ return (board && board.entries) ? board.entries : {}; }
function ridersOf(carId){
  var e = entries(), out = [];
  for(var k in e){ if(e[k] && e[k].car === carId) out.push({uid:k, name:e[k].name, ts:e[k].ts||0}); }
  out.sort(function(a,b){ return a.ts - b.ts; });
  return out;
}
function myEntry(){ return entries()[uid] || null; }
/* ---------- 차량 메모 ---------- */
function memosOf(carId){
  var m = (board && board.memos) ? board.memos[String(carId)] : null;
  return Array.isArray(m) ? m : [];
}
function saveMemos(carId, arr){
  var patch = {}; patch['memos.' + carId] = arr;
  return db.collection('board').doc(today).update(patch)
    .catch(function(){                       // 문서가 아직 없을 때
      var m = {}; m[String(carId)] = arr;
      return db.collection('board').doc(today).set({ date: today, memos: m }, { merge:true });
    });
}
function addMemo(carId, text){
  var arr = memosOf(carId).slice();
  if(arr.length >= 5) return Promise.reject(new Error('메모는 차량당 5개까지입니다'));
  arr.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    text: text.slice(0,40), uid: uid, name: me.name, ts: Date.now()
  });
  return saveMemos(carId, arr);
}
function delMemo(carId, id){
  return saveMemos(carId, memosOf(carId).filter(function(m){ return m.id !== id; }));
}

/* ---------- 마감 현황 텍스트 (메신저 붙여넣기용) ---------- */
function summaryText(){
  var out = '[퇴근셔틀] ' + fmtKo(today) + ' 마감 현황\n';
  cars().forEach(function(c, i){
    var dr = driverFor(i);
    var rid = ridersOf(c.id);
    var mm = memosOf(c.id);
    out += '\n' + c.id + '호차  ' + c.time + '  기사 ' + dr.name + '\n';
    out += '· ' + (rid.length ? rid.map(function(r){ return r.name; }).join(', ') : '없음') + '\n';
    if(mm.length){
      out += '· 메모 ' + mm.map(function(m){ return m.text; }).join(' / ') + '\n';
    }
  });

  var lv = todaysLeaves();
  out += '\n🚫 미이용 : ' + (lv.length
    ? lv.map(function(l){ return l.name + '(' + reasonLabel(l.reason) + ')'; }).join(', ')
    : '없음') + '\n';

  var miss = missingUsers();
  out += '⚠️ 미입력 : ' + (miss.length
    ? miss.map(function(u){ return u.name; }).join(', ')
    : '없음 (전원 입력 완료)') + '\n';

  return out;
}
function missingText(){
  var miss = missingUsers();
  var out = '[퇴근셔틀] ' + fmtKo(today) + '\n';
  out += '\u26A0\uFE0F ' + REMIND + ' 기준 미입력 ' + miss.length + '명\n\n';
  out += (miss.length ? miss.map(function(u){ return u.name; }).join(', ') : '없음 (전원 입력 완료)') + '\n\n';
  out += CUTOFF + '까지 탑승 또는 미이용 등록 부탁드립니다.\n';
  return out;
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(t);
  }
  return new Promise(function(res, rej){
    var ta = document.getElementById('shareTxt');
    if(!ta) return rej(new Error('NO_TA'));
    ta.removeAttribute('readonly');
    ta.focus(); ta.select();
    try { ta.setSelectionRange(0, 999999); } catch(e){}
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    ta.setAttribute('readonly', '');
    ok ? res() : rej(new Error('EXEC'));
  });
}

  openModal({ type:'share', title:'오늘 마감 현황', text: summaryText() });
}
function todaysLeaves(){
  return leaves.filter(function(l){ return l.start <= today && today <= l.end; });
}
function myLeaveToday(){
  var m = todaysLeaves().filter(function(l){ return l.uid === uid; });
  return m.length ? m[0] : null;
}
function reasonLabel(k){
  for(var i=0;i<REASONS.length;i++) if(REASONS[i].key === k) return REASONS[i].label;
  return '기타';
}
function totalStaff(){
  if(config && config.totalStaffOverride) return config.totalStaffOverride;
  return Math.max(users.length, 1);
}
function doneCount(){
  var set = {};
  var e = entries();
  for(var k in e) set[k] = 1;
  todaysLeaves().forEach(function(l){ if(l.uid) set[l.uid] = 1; });
  return Object.keys(set).length;
}
function missingUsers(){
  var e = entries(), lv = {};
  todaysLeaves().forEach(function(l){ if(l.uid) lv[l.uid] = 1; });
  return users.filter(function(u){ return !e[u.id] && !lv[u.id]; });
}

/* ============================================================
   Firebase 연결
   ============================================================ */
function fail(msg){
  var el = document.getElementById('splashErr');
  if(el){ el.style.display='block'; el.innerHTML = msg; }
}

function start(){
  try{
    db = firebase.firestore();
    auth = firebase.auth();
  }catch(e){
    fail('Firebase 초기화 실패<br>' + esc(e.message)); return;
  }

  auth.onAuthStateChanged(function(user){
    if(user){ uid = user.uid; subscribe(); }
  });
  auth.signInAnonymously().catch(function(e){
    if(e.code === 'auth/operation-not-allowed'){
      fail('<b>익명 로그인이 꺼져 있습니다.</b><br>Firebase 콘솔 → Authentication → Sign-in method →<br>익명(Anonymous) 사용 설정을 켜주세요.');
    } else {
      fail('로그인 실패<br>' + esc(e.message));
    }
  });
}

function subscribe(){
  // 설정
  db.collection('config').doc('app').onSnapshot(function(snap){
    if(snap.exists){ config = snap.data(); }
    else {
      config = {
        cars: DEFAULT_CARS, drivers: DEFAULT_DRIVERS,
        holidays: [], tempHolidayDate: null, adminPin: '0000',
        totalStaffOverride: null, capacity: CAPACITY
      };
      db.collection('config').doc('app').set(config).catch(function(){});
    }
    ready.cfg = true; render();
  }, err);

  // 내 계정
  db.collection('users').doc(uid).onSnapshot(function(snap){
    me = snap.exists ? snap.data() : null;
    render();
  }, err);

  // 전체 가입자
  db.collection('users').onSnapshot(function(snap){
    users = [];
    snap.forEach(function(d){ var v = d.data(); v.id = d.id; users.push(v); });
    users.sort(function(a,b){ return (a.name||'').localeCompare(b.name||'', 'ko'); });
    ready.users = true; render();
  }, err);

  // 미이용
  db.collection('leaves').onSnapshot(function(snap){
    leaves = [];
    snap.forEach(function(d){ var v = d.data(); v.id = d.id; leaves.push(v); });
    ready.leaves = true; render();
  }, err);

  watchBoard();
  setInterval(tick, 20000);
}

var boardUnsub = null;
function watchBoard(){
  if(boardUnsub) boardUnsub();
  boardUnsub = db.collection('board').doc(today).onSnapshot(function(snap){
    board = snap.exists ? snap.data() : { entries:{} };
    ready.board = true; render();
  }, err);
}
function err(e){
  console.error(e);
  if(e && e.code === 'permission-denied'){
    fail('<b>데이터 접근이 거부되었습니다.</b><br>Firestore 보안 규칙을 확인해 주세요.');
  }
}
function tick(){
  var d = dateStr(new Date());
  if(d !== today){ today = d; watchBoard(); }
  if(tab === 'home' && !view) render();
}

/* ============================================================
   동작
   ============================================================ */
function signUp(name){
  return db.collection('users').doc(uid).set({
    name: name, role: 'user',
    createdAt: Date.now(), lastSeenAt: Date.now()
  });
}

function book(carId){
  var ref = db.collection('board').doc(today);
  return db.runTransaction(function(tx){
    return tx.get(ref).then(function(snap){
      var data = snap.exists ? snap.data() : { entries:{} };
      var e = data.entries || {};
      var n = 0;
      for(var k in e){ if(e[k] && e[k].car === carId && k !== uid) n++; }
      if(n >= (config.capacity || CAPACITY)) throw new Error('FULL');
      e[uid] = { name: me.name, car: carId, ts: Date.now() };
      data.entries = e; data.date = today;
      tx.set(ref, data);
    });
  }).then(function(){
    return clearMyLeaveToday().then(function(cleared){
      if(cleared) toast('오늘 미이용 등록은 해제되었습니다');
    }).catch(function(){});
  });
}
function cancelBook(){
  var o = {};
  o['entries.' + uid] = firebase.firestore.FieldValue.delete();
  return db.collection('board').doc(today).update(o);
}
/* 탑승을 등록하면 오늘자 미이용은 해제한다 (기간 등록이면 오늘 하루만 빼낸다) */
function clearMyLeaveToday(){
  var lv = myLeaveToday();
  if(!lv) return Promise.resolve(false);
  var col = db.collection('leaves');
  if(lv.start === today && lv.end === today){
    return col.doc(lv.id).delete().then(function(){ return true; });
  }
  if(lv.start === today){
    return col.doc(lv.id).update({ start: addDays(today, 1) }).then(function(){ return true; });
  }
  if(lv.end === today){
    return col.doc(lv.id).update({ end: addDays(today, -1) }).then(function(){ return true; });
  }
  var tail = lv.end;
  return col.doc(lv.id).update({ end: addDays(today, -1) })
    .then(function(){
      return col.add({ uid: uid, name: me.name, reason: lv.reason,
                       start: addDays(today, 1), end: tail, createdAt: Date.now() });
    })
    .then(function(){ return true; });
}

function addLeave(reason, start, end){
  return db.collection('leaves').add({
    uid: uid, name: me.name, reason: reason, start: start, end: end, createdAt: Date.now()
  });
}
function delLeave(id){ return db.collection('leaves').doc(id).delete(); }
function saveConfig(patch){ return db.collection('config').doc('app').set(patch, {merge:true}); }
function isAdmin(){ return me && me.role === 'admin'; }

/* ============================================================
   렌더
   ============================================================ */
function render(){
  if(!ready.cfg || !ready.board || !ready.leaves || !ready.users) return;
  hideSplash();

  if(!me || !me.name){ app.innerHTML = viewOnboard(); bindOnboard(); return; }

  var html = '';
  if(view === 'leave')       html = viewLeave();
  else if(view === 'admin')  html = viewAdmin();
  else if(tab === 'status')  html = viewStatus();
  else if(tab === 'me')      html = viewMe();
  else                       html = viewHome();

  app.innerHTML = html + (view ? '' : tabbar()) + (modal ? renderModal() : '');
  bind();
  armHistory();
}

function hideSplash(){
  var s = document.getElementById('splash');
  if(s && !s.classList.contains('hide')){
    setTimeout(function(){ s.classList.add('hide'); setTimeout(function(){ s.style.display='none'; }, 400); }, 300);
  }
}

    + '<div class="ob-sheet">'

    +   '<div class="ob-p">한 번만 입력하면 이 휴대폰에 저장됩니다.<br>다음부터는 바로 탑승 등록만 하시면 됩니다.</div>'
    +   '<div class="field"><label>이름</label>'
    +     '<input id="obName" type="text" placeholder="예: 정상준" autocomplete="off" enterkeyhint="done">'
    +     '<div class="hint" id="obHint"></div></div>'
    +   '<div style="margin-top:auto"><button class="btn btn-pri btn-block" id="obGo" disabled>시작하기</button></div>'
    + '</div></div>';

function bindOnboard(){
  var inp = document.getElementById('obName');
  var btn = document.getElementById('obGo');
  var hint = document.getElementById('obHint');
  inp.addEventListener('input', function(){
    var v = inp.value.trim();
    btn.disabled = v.length < 2;
    var dup = users.filter(function(u){ return u.name === v; });
    if(dup.length){ hint.className = 'hint warn'; hint.textContent = '"' + v + '" 님은 이미 등록되어 있습니다. 동명이인이면 그대로 진행하세요.'; }
    else if(v.length === 1){ hint.className = 'hint bad'; hint.textContent = '이름을 두 글자 이상 입력해 주세요.'; }
    else { hint.className = 'hint'; hint.textContent = ''; }
  });
  btn.onclick = function(){
    var v = inp.value.trim();
    if(v.length < 2) return;
    btn.disabled = true; btn.textContent = '등록 중...';
    signUp(v).catch(function(e){
      btn.disabled = false; btn.textContent = '시작하기';
      toast('등록 실패: ' + e.message);
    });
  };
  setTimeout(function(){ inp.focus(); }, 400);
}

/* ---------- 홈 ---------- */
function header(){
  var d = new Date();
  var dateTxt = fmtKo(today);
  var left = toMins(CUTOFF) - minsNow();
  var cd;
  if(isHoliday(today))      cd = '<div class="countdown">휴무일 · 셔틀 미운행</div>';
  else if(isOffDay(today))  cd = '<div class="countdown">일요일 · 셔틀 미운행</div>';
  else if(left > 0)         cd = '<div class="countdown">입력 마감까지 <span class="mono">' + pad(Math.floor(left/60)) + ':' + pad(left%60) + '</span></div>';
  else                      cd = '<div class="countdown">등록 마감</div>';
  return '<div class="ghead"><div class="ghead-in">'
    + '<div class="date">' + dateTxt + '</div>'
    + '<div class="hello"><b>' + esc(me.name) + '</b>님, ' + greeting() + '</div>'
    + cd + '</div></div>';
}

/* 인사말 — 주말·휴무일 / 탑승 확정 / 오전 / 오후 */
function isWeekendDay(s){ var d = parseDate(s).getDay(); return d === 0 || d === 6; }
function greeting(){
  if(isWeekendDay(today) || isHoliday(today)) return '즐거운 주말 되세요!';
  if(myEntry())                               return '안전한 퇴근길 되세요!';
  if(new Date().getHours() < 12)              return 'Good Morning!';
  return 'Good Afternoon!';
}

/* 16:30 이후 = 미입력 명단, 17:00 이후 = 마감 현황 */
function noticeCard(){
  if(isHoliday(today) || isOffDay(today)) return '';
  var now = minsNow();
  if(now < toMins(REMIND)) return '';

  if(now < toMins(CUTOFF)){
    var miss = missingUsers();
    return '<div class="notice warn">'
      + '<div class="nt"><span class="nb">' + REMIND + '</span>미입력 ' + miss.length + '명</div>'
      + '<div class="nchips">' + (miss.length
          ? miss.map(function(u){ return '<span class="chip miss">' + esc(u.name) + '</span>'; }).join('')
          : '<span class="chip">전원 입력 완료</span>') + '</div>'
      + '<div class="ndesc">' + CUTOFF + '까지 등록하지 않으면 배차되지 않습니다.</div>'
      + '<button class="btn btn-pri btn-block ncopy" id="copyMiss">미입력 명단 복사</button>'
      + '</div>';
  }

  var tot = 0;
  cars().forEach(function(c){ tot += ridersOf(c.id).length; });
  return '<div class="notice done">'
    + '<div class="nt"><span class="nb">' + CUTOFF + '</span>오늘 배차 마감</div>'
    + '<div class="nsum">' + cars().map(function(c,i){
        var rr = ridersOf(c.id);
        return '<div class="nitem">'
             + '<div class="nrow"><b>' + c.id + '호차</b><em>' + esc(c.time) + '</em>'
             +   '<u>기사 ' + esc(driverFor(i).name) + '</u>'
             +   '<span>' + rr.length + '명</span></div>'
             + '<div class="nnames' + (rr.length ? '' : ' none') + '">'
             +   (rr.length ? rr.map(function(r){ return esc(r.name); }).join(', ') : '탑승자 없음')
             + '</div></div>';
      }).join('') + '</div>'
    + '<div class="ndesc">총 ' + tot + '명 탑승 · 미이용 ' + todaysLeaves().length + '명 · 미입력 ' + missingUsers().length + '명</div>'
    + '<button class="btn btn-pri btn-block ncopy" id="copySum">마감 현황 복사</button>'
    + (missingUsers().length
        ? '<button class="btn btn-out btn-block ncopy2" id="copyMiss">미입력 ' + missingUsers().length + '명 명단 복사</button>'
        : '')
    + '</div>';
}

function viewHome(){
  var mine = myEntry(), lv = myLeaveToday();
  var st;
  if(lv){
    st = '<div class="mystat leave lvwrap"><div class="mystat-row"><div class="ic">–</div><div style="flex:1;min-width:0">'
       + '<div class="t">오늘은 이용하지 않습니다</div>'
       + '<div class="d">' + esc(reasonLabel(lv.reason)) + ' · ' + fmtShort(lv.start) + ' ~ ' + fmtShort(lv.end) + '</div>'
       + '</div></div>'
       + '<div class="lvbtns">'
       +   '<button class="btn btn-out" id="editLeave">기간·사유 변경</button>'
       +   '<button class="btn btn-out" id="cancelLeave">등록 취소</button>'
       + '</div>';
  } else if(mine){
    var c = carById(mine.car), dr = driverFor(indexOfCar(mine.car));
    var order = ridersOf(mine.car).map(function(r){ return r.uid; }).indexOf(uid) + 1;
    st = '<div class="mystat ok"><div class="ic">✓</div><div>'
       + '<div class="t">' + mine.car + '호차 · ' + (c ? c.time : '') + ' 출발</div>'
       + '<div class="d">기사 ' + esc(dr.name) + ' · 탑승 ' + order + '번째</div></div></div>';
  } else {
    st = '<div class="mystat none"><div class="ic">!</div><div>'
       + '<div class="t">아직 입력하지 않으셨습니다</div>'
       + '<div class="d">' + CUTOFF + '까지 탑승 차량을 고르거나 미이용으로 등록해 주세요.</div></div></div>';
  }

  // 큰 일러스트는 화면당 1대: 내가 선택한 차량 > 없으면 1석 남은 차량
  var heroId = null;
  if(mine) heroId = mine.car;
  else {
    var cs = cars();
    for(var i=0;i<cs.length;i++){
      if(ridersOf(cs[i].id).length === (config.capacity||CAPACITY) - 1){ heroId = cs[i].id; break; }
    }
  }

  var list = cars().map(function(c, i){ return carCard(c, i, c.id === heroId, mine); }).join('');

  return header() + '<div class="scroll"><div class="sheet">'

    + st
    + noticeCard()
    + '<div class="seclbl">차량 선택</div>' + list

    + '</div></div>';
}

function carById(id){ var cs = cars(); for(var i=0;i<cs.length;i++) if(cs[i].id === id) return cs[i]; return null; }
function indexOfCar(id){ var cs = cars(); for(var i=0;i<cs.length;i++) if(cs[i].id === id) return i; return 0; }

function seatHtml(n, state){
  var cls = state === 'full' ? 'full' : (state === 'warn' ? 'warn' : 'on');
  var h = '<span class="seats">';
  var cap = config.capacity || CAPACITY;
  for(var i=0;i<cap;i++) h += '<i class="' + (i<n ? cls : '') + '"></i>';
  return h + '</span>';
}

function carCard(c, idx, hero, mine){
  var cap = config.capacity || CAPACITY;
  var rid = ridersOf(c.id), n = rid.length;
  var dr = driverFor(idx);
  var state = n >= cap ? 'full' : (n === cap-1 ? 'warn' : '');
  var picked = mine && mine.car === c.id;
  var cnt = state === 'full' ? '만석' : (cap - n) + '석' + (hero ? '' : ' 남음');
  var cntCls = state === 'full' ? ' full' : (state === 'warn' ? ' warn' : '');

  var call = dr.phone
    ? '<a class="callbtn" href="tel:' + esc(dr.phone) + '" aria-label="기사에게 전화">' + PHONE_SVG + '</a>'
    : '';
  var pl = plateOf(dr);
  var plate = pl ? '<div class="platebar"><span class="plate"><i></i>' + esc(pl) + '</span></div>' : '';

  var ridersHtml = rid.map(function(r){
    return '<span class="' + (r.uid === uid ? 'me' : '') + '">' + esc(r.name) + '</span>';
  }).join('');

  var skin = carSkin(c.id, state);
  var mm = memosOf(c.id);
  var memoRow = '<div class="memos">'
    + mm.map(function(m){
        var can = (m.uid === uid) || isAdmin();
        return '<span class="memo"><b>' + esc(m.text) + '</b>'
             + (m.name ? '<i>' + esc(m.name) + '</i>' : '')
             + (can ? '<button data-delmemo="' + c.id + '|' + m.id + '" aria-label="메모 삭제">×</button>' : '')
             + '</span>';
      }).join('')
    + '<button class="memoadd" data-addmemo="' + c.id + '">+ 메모</button></div>';

  var btn = '';
  if(picked)                     btn = '<button class="btn btn-out btn-sm" data-cancel="1">취소</button>';
  else if(state === 'full')      btn = '';
  else                           btn = '<button class="btn btn-pri btn-sm" data-book="' + c.id + '">' + (mine ? '변경' : '탑승') + '</button>';

  if(hero){
    return '<div class="carcard' + (picked ? ' picked' : '') + (state==='full' ? ' closed' : '') + '">'
      + '<div class="cc-top"><div class="cc-name"><b>' + c.id + '</b>호차</div>'
      +   (picked ? '<span class="picktag">탑승 확정</span>' : '')
      +   '<div class="cc-time">' + esc(c.time) + '</div></div>'
      + '<div class="cc-art ' + state + '"><svg class="car" style="' + skin + '" viewBox="0 0 288 132"><use href="#carnival"/></svg></div>'
      + plate
      + '<div class="cc-mid"><div class="cc-driver">기사 <b>' + esc(dr.name) + '</b></div>' + call
      +   '<div class="cc-seat">' + seatHtml(n, state) + '<span class="cc-cnt' + cntCls + '">' + cnt + '</span></div></div>'
      + memoRow
      + (rid.length || btn ? '<div class="cc-foot"><div class="riders">' + (ridersHtml || '<span style="background:none;color:var(--muted)">아직 없음</span>') + '</div>' + btn + '</div>' : '')
      + '</div>';
  }
  return '<div class="carcard slim' + (state==='full' ? ' closed' : '') + '">'
    + '<div class="slim-top">'
    +   '<div class="slim-left"><div class="slim-art ' + state + '"><svg class="car" style="' + skin + '" viewBox="0 0 288 132"><use href="#carnival"/></svg></div>' + plate + '</div>'
    +   '<div class="slim-main">'
    +     '<div class="slim-r1"><div class="cc-name"><b>' + c.id + '</b>호차</div><div class="cc-time">' + esc(c.time) + '</div></div>'
    +     '<div class="slim-r2"><div class="cc-driver">기사 <b>' + esc(dr.name) + '</b></div>' + call
    +       '<span class="cc-cnt' + cntCls + '">' + cnt + '</span></div>'
    +   '</div></div>'
    + memoRow
    + (rid.length || btn ? '<div class="cc-foot"><div class="riders">' + ridersHtml + '</div>' + btn + '</div>' : '')
    + '</div>';
}

        var pp = plateOf(d);
        return '<a class="merow" href="tel:' + esc(d.phone) + '"><span class="mi">📞</span>' + esc(d.name)
             + (pp ? '<span class="plate" style="margin-left:9px"><i></i>' + esc(pp) + '</span>' : '')
             + '<span class="mv">' + esc(fmtPhone(d.phone)) + ' ›</span></a>';
      }).join('') + '</div>'
    + '<div style="font-size:11px;color:var(--muted);padding:8px 6px 0;line-height:1.6">'
    +   '이번 주 배차 — ' + cars().map(function(c,i){ return c.id + '호차 ' + driverFor(i).name; }).join(' · ') + '</div>'
    + '<div class="seclbl">관리</div><div class="group">'
    +   '<button class="merow" id="goAdmin"><span class="mi">🔒</span>관리자 모드'
    +     '<span class="mv">' + (isAdmin() ? '사용 중 ›' : 'PIN 입력 ›') + '</span></button>'
    + '</div>'
    + '<div class="verline">v2.3.0 · shuttle-board2</div>'
    + '</div></div>';
}
function fmtPhone(p){
  if(!p) return '';
  var s = p.replace('+91','');
  return '+91 ' + s.slice(0,5) + ' ' + s.slice(5);
}

/* ---------- 관리자 ---------- */
function viewAdmin(){
  if(!calMonth){ var d = new Date(); calMonth = {y:d.getFullYear(), m:d.getMonth()}; }
  var hol = (config.holidays || []).slice().sort();
  var upcoming = hol.filter(function(h){ return h >= today; });

  return '<div class="ghead admin" style="padding-bottom:30px"><div class="ghead-in">'
    + '<button class="backbtn" id="back">‹ 뒤로</button>'
    + '<div style="margin-top:6px"><span class="adminbadge">관리자</span></div>'
    + '<div class="hello" style="margin-top:8px">운영 관리</div></div></div>'
    + '<div class="scroll"><div class="sheet">'
    + (config.adminPin === '0000' ? '<div class="banner red">관리자 PIN이 초기값(0000)입니다. 아래에서 변경해 주세요.</div>' : '')
    + '<div class="seclbl">법인 휴무일</div>'
    + '<div class="card">' + calendar() + '</div>'
    + (upcoming.length ? '<div style="margin-top:10px">' + upcoming.map(function(h){
        return '<span class="holchip">' + fmtShort(h) + ' <button data-delhol="' + h + '"><em>×</em></button></span>';
      }).join('') + '</div>' : '<div class="empty" style="padding:8px 4px">등록된 휴무일이 없습니다. 달력에서 날짜를 누르세요.</div>')
    + '<div class="seclbl">긴급</div><div class="group">'
    +   '<button class="merow" id="tgTemp"><span class="mi">⛔</span>오늘 임시 휴무'
    +     '<span class="toggle' + (config.tempHolidayDate === today ? '' : ' off') + '"></span></button>'
    + '</div>'
    + '<div class="seclbl">운영 설정</div><div class="group">'
    +   '<button class="merow" id="edDrivers"><span class="mi">🚐</span>기사 정보<span class="mv">' + drivers().length + '명 ›</span></button>'
    +   '<button class="merow" id="edUsers"><span class="mi">👥</span>가입자 관리<span class="mv">' + users.length + '명 ›</span></button>'
    +   '<button class="merow" id="edPin"><span class="mi">🔑</span>관리자 PIN 변경<span class="mv">›</span></button>'
    +   '<button class="merow" id="resetBoard"><span class="mi">↺</span>오늘 탑승 명단 초기화<span class="mv" style="color:var(--danger)">›</span></button>'
    + '</div>'
    + '<div class="seclbl">기사 배차 (4주 로테이션)</div><div class="card">'
    + cars().map(function(c,i){
        return '<div class="strow"><div class="sl">' + c.id + '호차<em>' + esc(c.time) + '</em></div>'
             + '<div class="sn">' + esc(driverFor(i).name)
             + (plateOf(driverFor(i)) ? ' <span class="plate"><i></i>' + esc(plateOf(driverFor(i))) + '</span>' : '')
             + ' <span style="color:var(--muted)">' + esc(fmtPhone(driverFor(i).phone)) + '</span></div></div>';
      }).join('') + '</div>'
    + '</div></div>';
}

function calendar(){
  var y = calMonth.y, m = calMonth.m;
  var first = new Date(y, m, 1), last = new Date(y, m+1, 0);
  var hol = config.holidays || [];
  var h = '<div class="cal-h"><button data-cal="-1">‹</button>' + y + '년 ' + (m+1) + '월<button data-cal="1">›</button></div>';
  h += '<div class="cal-g">';
  ['일','월','화','수','목','금','토'].forEach(function(d){ h += '<b>' + d + '</b>'; });
  for(var i=0;i<first.getDay();i++) h += '<button class="off"></button>';
  for(var d=1; d<=last.getDate(); d++){
    var ds = y + '-' + pad(m+1) + '-' + pad(d);
    var cls = [];
    if(hol.indexOf(ds) >= 0) cls.push('hol');
    else if(new Date(y,m,d).getDay() === 0) cls.push('sun');
    if(ds === today) cls.push('today');
    h += '<button class="' + cls.join(' ') + '" data-day="' + ds + '">' + d + '</button>';
  }
  return h + '</div>';
}

/* ---------- 탭바 / 모달 ---------- */
function tabbar(){
  function t(k, label){
    return '<button class="tab' + (tab===k ? ' on' : '') + '" data-tab="' + k + '">'
         + '<svg viewBox="0 0 24 24">' + TAB_ICON[k] + '</svg>' + label + '</button>';
  }
  return '<div class="tabbar">' + t('home','홈') + t('status','현황') + t('me','내정보') + '</div>';
}

function renderModal(){
  var m = modal, body = '';
  if(m.type === 'confirm'){
    body = '<div class="modal-h">' + esc(m.title) + '</div><div class="modal-p">' + m.desc + '</div>'
         + '<div class="modal-row"><button class="btn btn-out" data-mc="0">' + esc(m.cancel || '취소') + '</button>'
         + '<button class="btn ' + (m.danger ? 'btn-danger' : 'btn-pri') + '" data-mc="1">' + esc(m.ok || '확인') + '</button></div>';
  } else if(m.type === 'pin'){
    body = '<div class="modal-h">' + esc(m.title) + '</div><div class="modal-p">' + esc(m.desc || '') + '</div>'
         + '<div class="pinbox"><input id="pin" type="tel" inputmode="numeric" maxlength="4" placeholder="0000"></div>'
         + '<div class="modal-row"><button class="btn btn-out" data-mc="0">취소</button>'
         + '<button class="btn btn-pri" data-mc="1">확인</button></div>';
  } else if(m.type === 'text'){
    body = '<div class="modal-h">' + esc(m.title) + '</div>'
         + '<div class="field"><input id="mtext" type="text" value="' + esc(m.value||'') + '" placeholder="' + esc(m.ph||'') + '"></div>'
         + '<div class="modal-row"><button class="btn btn-out" data-mc="0">취소</button>'
         + '<button class="btn btn-pri" data-mc="1">저장</button></div>';
  } else if(m.type === 'share'){
    body = '<div class="modal-h">' + esc(m.title) + '</div>'
         + '<div class="modal-p">아래 내용이 복사됩니다. 메신저에 붙여넣으세요.</div>'
         + '<textarea class="sharebox" id="shareTxt" readonly>' + esc(m.text) + '</textarea>'
         + '<div class="modal-row"><button class="btn btn-out" data-mc="0">닫기</button>'
         + '<button class="btn btn-pri" data-mc="1">복사하기</button></div>';
  } else if(m.type === 'drivers'){
    body = '<div class="modal-h">기사 정보</div><div class="modal-p">이름 · 전화번호 · 차량번호를 수정할 수 있습니다.</div>'
         + drivers().map(function(d,i){
             return '<div class="field"><label>' + (i+1) + '번</label>'
                  + '<input class="drName" data-i="' + i + '" value="' + esc(d.name) + '" placeholder="이름">'
                  + '<div class="drrow">'
                  +   '<input class="drPhone" data-i="' + i + '" value="' + esc(d.phone) + '" placeholder="+919999999999" inputmode="tel">'
                  +   '<input class="drPlate" data-i="' + i + '" value="' + esc(plateOf(d)) + '" placeholder="차량번호" inputmode="numeric">'
                  + '</div></div>';
           }).join('')
         + '<div class="modal-row"><button class="btn btn-out" data-mc="0">취소</button>'
         + '<button class="btn btn-pri" data-mc="1">저장</button></div>';
  } else if(m.type === 'users'){
    body = '<div class="modal-h">가입자 ' + users.length + '명</div><div class="modal-p">이름을 눌러 수정하거나 삭제할 수 있습니다.</div>'
         + '<div style="max-height:46vh;overflow:auto;margin-top:14px">'
         + users.map(function(u){
             return '<div class="lv"><span style="font-weight:700;font-size:13px">' + esc(u.name) + '</span>'
                  + (u.role === 'admin' ? '<span class="chip" style="background:var(--tint);color:var(--brand-dark);font-weight:700">관리자</span>' : '')
                  + '<button class="del" data-deluser="' + u.id + '">×</button></div>';
           }).join('') + '</div>'
         + '<div class="modal-row"><button class="btn btn-out btn-block" data-mc="0">닫기</button></div>';
  }
  return '<div class="modal" id="modal"><div class="modal-in">' + body + '</div></div>';
}

/* ============================================================
   이벤트 바인딩
   ============================================================ */
function bind(){
  // 탭
  each('[data-tab]', function(el){ el.onclick = function(){ setTab(el.dataset.tab); }; });
  var back = document.getElementById('back');
  if(back) back.onclick = function(){ closeView(); };

  // 홈
  each('[data-book]', function(el){
    el.onclick = function(){
      var id = +el.dataset.book;
      el.disabled = true;
      book(id).catch(function(e){
        el.disabled = false;
        toast(e.message === 'FULL' ? '방금 만석이 되었습니다' : '실패: ' + e.message);
      });
    };
  });
  each('[data-cancel]', function(el){
    el.onclick = function(){
      openModal({ type:'confirm', title:'탑승을 취소할까요?', desc:'다시 다른 차량을 고르실 수 있습니다.', ok:'취소하기', danger:true,
                run:function(){ cancelBook().then(function(){ toast('취소되었습니다'); }); } });
    };
  });
  // 차량 메모
  each('[data-addmemo]', function(el){
    el.onclick = function(){
      var id = +el.dataset.addmemo;
      openModal({ type:'text', title: id + '호차 메모', ph:'예: 오늘 20분 지연 / 정문 앞 대기', value:'',
        run:function(v){
          v = (v||'').trim();
          if(!v) return;
          addMemo(id, v).then(function(){ toast('메모를 등록했습니다'); })
                        .catch(function(e){ toast(e.message); });
        }});
    };
  });
  each('[data-delmemo]', function(el){
    el.onclick = function(){
      var p = el.dataset.delmemo.split('|');
      delMemo(+p[0], p[1]).then(function(){ toast('메모를 삭제했습니다'); });
    };
  });

  var gl = document.getElementById('goLeave');
  if(gl) gl.onclick = function(){ draft = {reason:'own', start:today, end:today, quick:'today', editId:null}; openView('leave'); };

  var el = document.getElementById('editLeave');
  if(el) el.onclick = function(){
    var lv = myLeaveToday();
    if(!lv) return;
    draft = { reason:lv.reason, start:lv.start, end:lv.end, quick:'custom', editId:lv.id };
    openView('leave');
  };
  var cl = document.getElementById('cancelLeave');
  if(cl) cl.onclick = function(){
    var lv = myLeaveToday();
    if(!lv) return;
    openModal({ type:'confirm', title:'미이용 등록을 취소할까요?', desc:'다시 탑승 차량을 고르실 수 있습니다.', ok:'등록 취소', danger:true,
      run:function(){ delLeave(lv.id).then(function(){ toast('취소되었습니다'); }); } });
  };

  // 미이용
  each('[data-reason]', function(el){ el.onclick = function(){ draft.reason = el.dataset.reason; render(); }; });
  each('[data-quick]', function(el){
    el.onclick = function(){
      var k = el.dataset.quick; draft.quick = k;
      if(k === 'today'){ draft.start = today; draft.end = today; }
      else if(k === 'tomorrow'){ draft.start = today; draft.end = addDays(today, 1); }
      else if(k === 'week'){
        // 이번 주 = 오늘부터 이번 주 토요일까지 (월~토 운행)
        var d = parseDate(today), dow = d.getDay();
        draft.start = today; draft.end = addDays(today, dow === 0 ? 6 : (6 - dow));
      }
      render();
    };
  });
  var ds = document.getElementById('dStart'), de = document.getElementById('dEnd');
  if(ds) ds.onchange = function(){ draft.start = ds.value; draft.quick='custom'; if(draft.end < draft.start) draft.end = draft.start; render(); };
  if(de) de.onchange = function(){ draft.end = de.value; draft.quick='custom'; if(draft.end < draft.start) draft.start = draft.end; render(); };
  each('[data-dellv]', function(el){
    el.onclick = function(){ delLeave(el.dataset.dellv).then(function(){ toast('삭제되었습니다'); }); };
  });
  var sl = document.getElementById('saveLeave');
  if(sl) sl.onclick = function(){
    sl.disabled = true;
    var edit = draft.editId;
    var hadSeat = !!myEntry();
    var p = hadSeat ? cancelBook().catch(function(){}) : Promise.resolve();
    if(edit) p = p.then(function(){ return delLeave(edit); });
    p.then(function(){ return addLeave(draft.reason, draft.start, draft.end); })
     .then(function(){ draft.editId = null;
        toast(hadSeat ? '탑승 등록이 취소되고 미이용으로 등록되었습니다'
                      : (edit ? '변경되었습니다' : '미이용으로 등록되었습니다'));
        closeView(); })
     .catch(function(e){ sl.disabled = false; toast('실패: ' + e.message); });
  };
  var dl = document.getElementById('delEditLeave');
  if(dl) dl.onclick = function(){
    var id = draft.editId;
    openModal({ type:'confirm', title:'미이용 등록을 취소할까요?', desc:'다시 탑승 차량을 고르실 수 있습니다.', ok:'등록 취소', danger:true,
      run:function(){ delLeave(id).then(function(){ draft.editId = null; toast('취소되었습니다'); closeView(); }); } });
  };

  // 내정보
  var cn = document.getElementById('chName');
  if(cn) cn.onclick = function(){
    openModal({ type:'text', title:'이름 변경', value:me.name, ph:'이름',
      run:function(v){
        if(!v || v.trim().length < 2) return toast('두 글자 이상 입력해 주세요');
        db.collection('users').doc(uid).update({ name: v.trim() }).then(function(){ toast('변경되었습니다'); });
      }});
  };
  var ga = document.getElementById('goAdmin');
  if(ga) ga.onclick = function(){
    if(isAdmin()){ openView('admin'); return; }
    openModal({ type:'pin', title:'관리자 PIN', desc:'4자리 숫자를 입력해 주세요.',
      run:function(v){
        if(v === (config.adminPin || '0000')){
          db.collection('users').doc(uid).update({ role:'admin' }).then(function(){ openView('admin'); });
        } else toast('PIN이 맞지 않습니다');
      }});
  };

  // 관리자
  each('[data-cal]', function(el){
    el.onclick = function(){
      calMonth.m += +el.dataset.cal;
      if(calMonth.m < 0){ calMonth.m = 11; calMonth.y--; }
      if(calMonth.m > 11){ calMonth.m = 0; calMonth.y++; }
      render();
    };
  });
  each('[data-day]', function(el){
    el.onclick = function(){
      var d = el.dataset.day, hol = (config.holidays || []).slice();
      var i = hol.indexOf(d);
      if(i >= 0) hol.splice(i,1); else hol.push(d);
      saveConfig({ holidays: hol }).then(function(){ toast(i>=0 ? '휴무일 해제' : '휴무일 등록'); });
    };
  });
  each('[data-delhol]', function(el){
    el.onclick = function(){
      var hol = (config.holidays||[]).filter(function(h){ return h !== el.dataset.delhol; });
      saveConfig({ holidays: hol });
    };
  });
  var cs2 = document.getElementById('copySum');
  if(cs2) cs2.onclick = function(){ openSummary(); };
  var cm = document.getElementById('copyMiss');
  if(cm) cm.onclick = function(){
    openModal({ type:'share', title: REMIND + ' 미입력 명단', text: missingText() });
  };

  var tt = document.getElementById('tgTemp');
  if(tt) tt.onclick = function(){
    saveConfig({ tempHolidayDate: config.tempHolidayDate === today ? null : today });
  };
  var ed = document.getElementById('edDrivers');
  if(ed) ed.onclick = function(){ openModal({ type:'drivers' }); };
  var eu = document.getElementById('edUsers');
  if(eu) eu.onclick = function(){ openModal({ type:'users' }); };
  var ep = document.getElementById('edPin');
  if(ep) ep.onclick = function(){
    openModal({ type:'pin', title:'새 관리자 PIN', desc:'앞으로 사용할 4자리 숫자입니다.',
      run:function(v){
        if(!/^\d{4}$/.test(v)) return toast('숫자 4자리를 입력해 주세요');
        saveConfig({ adminPin: v }).then(function(){ toast('PIN이 변경되었습니다'); });
      }});
  };
  var rb = document.getElementById('resetBoard');
  if(rb) rb.onclick = function(){
    openModal({ type:'confirm', title:'오늘 탑승 명단을 모두 지울까요?', desc:'되돌릴 수 없습니다. 미이용 등록과 메모는 유지됩니다.', ok:'초기화', danger:true,
      run:function(){ db.collection('board').doc(today).set({ entries:{}, date:today, memos:(board&&board.memos)||{} }).then(function(){ toast('초기화되었습니다'); }); } });
  };

  bindModal();
}

function bindModal(){
  if(!modal) return;
  var root = document.getElementById('modal');
  if(!root) return;
  root.onclick = function(e){ if(e.target === root){ closeModal(); } };

  each('[data-deluser]', function(el){
    el.onclick = function(){
      db.collection('users').doc(el.dataset.deluser).delete().then(function(){ toast('삭제되었습니다'); });
    };
  });

  each('[data-mc]', function(el){
    el.onclick = function(){
      var ok = el.dataset.mc === '1';
      var m = modal;
      if(!ok){ closeModal(); return; }
      if(m.type === 'share'){
        copyText(m.text)
          .then(function(){ closeModal(); toast('복사되었습니다. 메신저에 붙여넣으세요'); })
          .catch(function(){ toast('아래 내용을 길게 눌러 직접 복사해 주세요'); });
        return;
      }
      if(m.type === 'pin'){
        var v = (document.getElementById('pin')||{}).value || '';
        closeModal(); if(m.run) m.run(v.trim()); return;
      }
      if(m.type === 'text'){
        var t = (document.getElementById('mtext')||{}).value || '';
        closeModal(); if(m.run) m.run(t); return;
      }
      if(m.type === 'drivers'){
        var list = drivers().slice();
        each('.drName', function(inp){ list[+inp.dataset.i].name = inp.value.trim(); });
        each('.drPhone', function(inp){ list[+inp.dataset.i].phone = inp.value.trim(); });
        each('.drPlate', function(inp){ list[+inp.dataset.i].plate = inp.value.trim(); });
        closeModal();
        saveConfig({ drivers: list }).then(function(){ toast('저장되었습니다'); });
        return;
      }
      closeModal(); if(m.run) m.run();
    };
  });

  var pin = document.getElementById('pin');
  if(pin) setTimeout(function(){ pin.focus(); }, 100);
  var mt = document.getElementById('mtext');
  if(mt) setTimeout(function(){ mt.focus(); mt.select(); }, 100);
}

function each(sel, fn){
  var list = document.querySelectorAll(sel);
  for(var i=0;i<list.length;i++) fn(list[i]);
}

/* ============================================================
   시작
   ============================================================ */
start();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}
})();
